name: Static preview and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, and imports
        run: pnpm check:biome

      - name: Check TypeScript
        run: pnpm check:types

      - name: Build static site
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test the static site
        run: pnpm test:e2e

      - name: Upload the preview
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cookie-consent-preview
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Read GitHub Pages configuration
        if: github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Build for the GitHub Pages URL
        if: github.ref == 'refs/heads/main'
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build

      - name: Upload the GitHub Pages build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: out/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
